# SPA (ssr: false): toda rota desconhecida cai no index.html — equivalente ao
# `not_found_handling: single-page-application` do wrangler.jsonc.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /_nuxt/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
