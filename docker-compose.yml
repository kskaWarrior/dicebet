# Stack local do DiceBet SOBRE o banco único da plataforma (rollout RGS,
# docs/adr/0002-carteira-de-rgs.md): Postgres e GoTrue sobem no compose do repo `rgs`
# (portas 57332/57331); aqui só o que é do jogo.
#
#   migrate   aplica o schema `rgs` (do pacote) e o `dicebet` no banco do rgs.
#   api/web   mesmas imagens de antes; o web é `nuxt generate` servido por nginx.
#
#   scripts/local-up.sh     (sobe o rgs antes, se preciso)
#
# Os containers alcançam o postgres do rgs por host.docker.internal:57332; o navegador
# alcança gotrue em 127.0.0.1:57331 e a api em localhost:${API_PORT}.
services:
  migrate:
    build:
      context: ./apps/api
      secrets: [npmrc]
    command: ["sh", "-c", "node node_modules/@kskawarrior/rgs-core/db/migrate.mjs && node db/migrate.mjs"]
    environment:
      DATABASE_URL: postgres://postgres:postgres@host.docker.internal:57332/rgs
      # Uma dona da senha do role da API: o migrate cria o role com ela e a api
      # conecta com ela — trocar API_DB_PASSWORD no .env troca nos dois.
      API_DB_PASSWORD: ${API_DB_PASSWORD:-dicebet_api}
    volumes:
      - ./db:/app/db:ro
    extra_hosts: ["host.docker.internal:host-gateway"]

  api:
    build:
      context: ./apps/api
      secrets: [npmrc]
    # API_PORT (.env) quando a 8080 já estiver ocupada na máquina.
    ports: ["${API_PORT:-8080}:8080"]
    environment:
      DATABASE_URL: postgres://dicebet_api:${API_DB_PASSWORD:-dicebet_api}@host.docker.internal:57332/rgs
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?veja .env.example}
      AUTH_AUDIENCE: authenticated
      CORS_ORIGINS: http://localhost:3000,http://localhost:${WEB_PORT:-3000},capacitor://localhost,http://localhost
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:8080/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))\""]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      secrets: [npmrc]
      args:
        # Embutidas no bundle em tempo de `nuxt generate` (ssr: false) — são
        # as URLs vistas pelo NAVEGADOR, não pelos containers.
        NUXT_PUBLIC_API_BASE: http://localhost:${API_PORT:-8080}
        NUXT_PUBLIC_AUTH_URL: http://127.0.0.1:57331
    ports: ["${WEB_PORT:-3000}:80"]
    depends_on:
      api:
        condition: service_healthy

# O ~/.npmrc do host autentica no GitHub Packages para instalar
# @kskawarrior/rgs-core (ver README). Só em build, nunca em camada da imagem.
secrets:
  npmrc:
    file: ${HOME}/.npmrc
